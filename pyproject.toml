[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fastlisi"
version = "0.1.0"
description = "Fast Local Inverse Simpson Index (LISI) for evaluating single-cell batch integration"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Ilya Korsunsky" },
    { name = "Kamil Slowikowski", email = "kslowikowski@gmail.com" },
]
keywords = ["lisi", "simpson", "batch-correction", "integration", "single-cell", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pandas", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/USER/fastlisi"
Repository = "https://github.com/USER/fastlisi"
Issues = "https://github.com/USER/fastlisi/issues"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["fastlisi"]
sdist.include = ["tests/data/*.tsv.gz"]
sdist.exclude = [".github"]
build.verbose = true
cmake.version = ">=3.15"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *-win32 *-manylinux_i686"
test-requires = ["pytest", "pandas"]
test-command = "pytest {project}/tests -v"
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# AppleClang needs Homebrew's libomp for OpenMP; CMakeLists.txt locates it.
# cibuildwheel's delocate step bundles libomp.dylib into the wheel.
before-all = "brew install libomp"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
